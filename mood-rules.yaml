# 成績連動エモートの判定ルール
#
# ペーパートレード実績（`records/performance.*.yaml`）から、キャラクターの表情を
# normal / down / up のいずれかに決めるための基準です。
#
# - 判定に使うのは**実績だけ**です。稼働状態（`status.yaml` の `state`：
#   IDLE / LADDERING / HIBERNATING など）は判定に使いません。両者は完全に分離します。
# - キャラクター進化（`agent.yaml` version の major）とも別のものです。
#   進化は外見そのものの変化、本ファイルが決めるのは同じ形態内の表情差分です。
# - 判定結果はどのファイルにも保存しません。表示側が毎回算出します。
# - 本ファイルの値をエージェント自身が書き換えません。変更は人間が判断します。

# 本ファイルの形式の版。エージェント本体のバージョンではありません。
# エージェントのバージョンは agent.yaml の version だけが持ちます（唯一の正）。
schema_version: 1

# 判定の順序。上から評価し、最初に該当したものを結果とします。
# down を先に評価するのは、負けている状態を勝ちの条件で打ち消さないためです。
# （直近24時間が +2% でも、ドローダウンが 5% 以上なら down）
evaluation_order:
  - down
  - up
  - normal

# 各ルールの条件。`any` は「いずれか1つでも満たせば該当」を意味します。
#
# 条件名の末尾が比較の向きを表します。
#   `_lte` = その値以下 (<=) ／ `_gte` = その値以上 (>=)
# 単位は `_pct` が百分率、それ以外は回数です。
#
# `current_drawdown_from_peak_pct` は、**過去最高資産から現在までの下落率を
# 正の数で表した値**です（5 なら 5% の下落）。`status.yaml` の
# `account.drawdown_pct`（初期資金比・マイナスで表す）とは意味・符号・基準点が
# 異なる別の値です。取り違えると判定が反転するため、名前で区別します。
#
# 実績側の値が null（未観測）の条件は、満たしていないものとして扱います。
# 観測していない値で表情を動かさないためです。
rules:
  down:
    any:
      pnl_24h_pct_lte: -2 # 直近24時間の損益率が -2% 以下
      consecutive_losses_gte: 3 # 3連敗以上
      current_drawdown_from_peak_pct_gte: 5 # 現在のドローダウンが 5% 以上

  up:
    any:
      pnl_24h_pct_gte: 2 # 直近24時間の損益率が +2% 以上
      consecutive_wins_gte: 3 # 3連勝以上

# どのルールにも該当しなかったときの結果。
default: normal
