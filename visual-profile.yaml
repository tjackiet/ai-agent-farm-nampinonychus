# ナンピノニクスの表示用プロフィール
#
# 将来の HTML ステータス画面が読み込む、静的な表示データです。
# 性格・傾向・特性・技など「変わらないもの」だけを置きます。
#
# - 口座・建玉・損益・階段の段数といった動的な運用状態は `status.yaml` が持ちます。
#   本ファイルは運用状態を一切持ちません。
# - 数値パラメータの正は `agent.yaml` です。本ファイルの値は表示のための要約であり、
#   売買判断には使いません。食い違う場合は常に `agent.yaml` を優先します。
# - 各値の根拠は行コメントに残しています。
# - 本ファイルの値をエージェント自身が書き換えません。変更は人間が判断します。

# 本ファイルの形式の版。エージェント本体のバージョンではありません。
# エージェントのバージョンは agent.yaml の version だけが持ちます（唯一の正）。
schema_version: 1

identity:
  name: ナンピノニクス # agent.yaml agent.name
  # キャラクターの性格を表す呼び名。戦略の分類は strategy_tags 側に置く。
  personality_tag: 押し目信者 # personality.md「下がったら、うれしい」／「下がるほど関心が高まる」
  strategy_tags: # 戦略の分類。agent.yaml agent.archetype (contrarian-dca) に対応
    - 逆張り # strategy.no_chase「現在価格がアンカー以上の間は新規買いを行わない」
    - ナンピン # strategy.ladder（5段の買い下がり）

# 各軸の 0 と 100 の意味。HTML 側に軸ラベルを持たせないため、ここで定義します。
tendency_scale:
  risk: { min_label: 守り, max_label: 攻め }
  decision_speed: { min_label: 熟考, max_label: 即断 }
  time_horizon: { min_label: 短期, max_label: 長期 }
  adaptability: { min_label: 固定, max_label: 柔軟 }
  memory: { min_label: 忘却, max_label: 執着 }

# すべて 0〜100。意味は tendency_scale のとおり。
#
# TODO: 以下は設計段階（agent.yaml agent.phase: design）の初期案です。
#   ペーパートレードの実績が出たあとに見直す余地がありますが、
#   見直すかどうかは人間が判断します。エージェント自身は書き換えません。
tendencies:
  # personality.md「リスク許容度 5/10」を基準（= 50）に、risk-policy.md の上限
  # （建玉は初期資金の 60% まで／現金 20% は常時維持／6段目は存在しない／
  # 予算を倍々にするマーチンゲールは採らない）を反映して守り側へ寄せた。
  risk: 35

  # personality.md「決断速度 3/10」をそのまま採用（3/10 → 30）。
  # 売買の間隔（約定後30分のクールダウン、1日16回まで）は短いが、
  # 「一度に全部は買わない」という決断の姿勢そのものは変わっていない。
  decision_speed: 30

  # 建玉の保有上限が 3 日（strategy.exit.time_stop_days）で、それ以上は持たない。
  # 実測では +0.3% への到達が中央値 2.88 時間。数時間から数日で決着する短期寄り。
  # 一方で personality.md「忍耐力 9/10」により、買えない時間は待ち続ける。
  time_horizon: 25

  # personality.md「規律 10/10」「ルールにない買い増しをしない」の裏返し。
  # ただしアンカーを毎回計算し直す（相場に合わせて基準そのものは動く）ため 0 ではない。
  adaptability: 10

  # memory-policy.md：日次サマリと lessons.md は削除しない（無期限保持）。
  # 一方で判断ログは 90 日で削除し、lessons.md も 50 件で統合するため 100 ではない。
  memory: 75

traits:
  - name: 忍耐
    description: 何日も何も買わずに待つ。待つことを損失と感じない。
    # personality.md 性格パラメータ「忍耐力 9/10」

  - name: 予想しない
    description: 「まだ下がる」「そろそろ底だ」を判断材料にしない。見るのは価格と自分の建玉だけ。
    # personality.md「相場観への自信 2/10」／行動原則4「予想しない」

  - name: 規律優先
    description: 買いたいと思っても risk-policy.md が止めるなら止まる。「今回だけは」を認めない。
    # personality.md「規律 10/10」／「両者が矛盾したときは、常に risk-policy.md が勝つ」

skills:
  - name: 買い下がりの階段
    description: アンカーから -0.5% で1段目。以降は直前の約定から -0.5/-0.7/-1.0/-1.5% と間隔を広げ、5段・合計 600,000 JPY まで買い下がる。
    # agent.yaml strategy.ladder（1段目 80,000／以降 100,000・120,000・140,000・160,000 JPY）

  - name: 高値は追わない
    description: 現在価格が直近2時間の15分足高値（アンカー）以上の間、新規買いを行わない。
    # agent.yaml strategy.no_chase / strategy.anchor

  - name: 二段階利確
    description: 平均取得単価 +0.3% で建玉の半分、+0.6% で残り全量を利確する。売り指値は常時板に置く。
    # agent.yaml strategy.exit.take_profit

  - name: 冬眠
    description: 総資産が初期資金比 -15% を下回ると新規買いを全面停止する。利確の売り指値は維持する。
    # agent.yaml risk.drawdown.halt_new_buys_pct / risk-policy.md HIBERNATING

# personality.md「一言でいうと」。
# agent.yaml の tagline「下落を待ち、下落を買う」を、情緒の側から言い換えたもの。
creed: 下がったら、うれしい。

# 現在のキャラクター形態の説明。
#
# 進化段階の番号は持ちません。段階の番号は agent.yaml version の major そのものです。
# 表示側は agent.yaml から major を読み取り、本セクションを「その形態の説明」として
# 表示します。major が上がったときにだけ次の形態へ進化します（= 見た目そのものが
# 変わる）。minor の更新では進化しません。本セクションは人間が書き換えます。
#
# 進化はアップデートやメンテナンスによる外見の変化であり、
# 強さや運用成績を表しません。成績による変化は character の
# normal / down / up（成績連動エモート）が担い、進化とは分離します。
evolution:
  stage_name: 初期形態 # v1.x は必ず初期形態。
  description: 小さく、弱そうで、不格好な未成熟個体

  # 初期形態が満たすべき外見の条件。v1.x の間は変わりません。
  appearance:
    - 小さい
    - 未成熟で弱そう
    - 少し不格好で、不器用で、不細工
    - 完成された強者には見えない
    - 今後の進化余地を感じられる

# キャラクター画像。画像はまだ作成しておらず、置き場所だけを定義します。
# 画像は形態ごとに分けて置きます。
#
# `{major}` は agent.yaml version の major に置き換えます
# （agent.yaml の {pair} / {date} と同じ書き方です）。
# ここに v1 と直接書かないのは、major を2か所に持たないためです。
# v1.x の間はすべて character/v1/ が使われ、major が上がった時点で
# character/v2/ を作って画像を置きます。過去の形態の画像は消しません。
character:
  normal: "character/v{major}/normal.webp"
  down: "character/v{major}/down.webp"
  up: "character/v{major}/up.webp"
  # normal / down / up は同じバージョン内での表情差分（成績連動エモート）であり、
  # 形態そのものの変化（evolution）とは別のものです。
  #
  # どれを表示するかは本ファイルでは決めません。
  # 成績連動エモートは、performance データ（records/performance.*.yaml）を
  # mood-rules.yaml で評価して決定します。
  # 判定条件の唯一の正は mood-rules.yaml であり、ここには複製しません。
  # 運用状態（IDLE / LADDERING などの state）は判定に使いません。

# TODO: 状態別のセリフ（personality.md「状態別のセリフ」）を本ファイルに持たせるかは未定。
#   現状は personality.md の一覧と status.yaml の mood が担っているため、
#   二重管理を避けてここには置いていない。
