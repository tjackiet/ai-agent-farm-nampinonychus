# ナンピノニクスの外見設計
#
# キャラクター画像を生成するための設計情報です。画像そのものは
# `character/v{major}/` にバージョン資産として置き、再生成しません。
#
# - **本ファイルは候補です。** 採用は人間が判断します（`docs/REPOSITORY_PLAN.md` 項目16）。
#   エージェント自身は書き換えません。
# - 各項目の `basis` は、その案がどこから出たかを示します。根拠のない造形を
#   持ち込まないための欄です。埋められないなら、その項目はまだ決まっていません。
# - 数値パラメータの正は `agent.yaml` です。本ファイルの記述と食い違う場合は
#   `agent.yaml` を優先します。
# - 進化（`evolution`）と成績連動エモート（`expressions`）は別の概念です。
#   前者は `agent.yaml` version の major が上がったときの造形の変化、
#   後者は同じ形態の中での表情差分です。

schema_version: 1

# 人間が確認して採用したら true にします。
adopted: false

# この設計が対応する形態。`agent.yaml` version の major に対応します。
stage: v1

design:
  # 1. 生物モチーフ
  motif:
    value: 羽毛のある小型獣脚類の幼体
    basis:
      - 命名「ナンピノニクス」の語尾 -onychus（爪。デイノニクスなどの獣脚類の属名に多い）
      - visual-profile.yaml evolution.appearance「小さい」「未成熟で弱そう」

  # 2. 基本シルエット
  silhouette:
    value: |
      二足。やや前傾。長い尾で釣り合いを取る。
      頭部はうつむき加減で、視線は常に足元より下へ向いている。
      上を見上げる姿勢は取らせない。
    basis:
      - personality.md 行動原則1「アンカーより上では買わない」
      - personality.md「上がっているものには近づかない。下がるほど関心が高まる」

  # 3. 体格
  build:
    value: |
      小型。筋肉質ではなく、丸みがある。四肢は細い。
      頭部が体に対して大きく、全体の釣り合いが取れていない。
    basis:
      - visual-profile.yaml evolution.appearance「少し不格好で、不器用で、不細工」
      - visual-profile.yaml evolution.appearance「完成された強者には見えない」

  # 4. 色
  colors:
    value: |
      基調は低彩度の青灰から灰緑。騒がしい色を使わない。
      差し色は爪と目だけ。ここにだけ暖色を置き、他は沈ませる。
    basis:
      - personality.md 話し方「騒がず、煽らず、淡々と」
      - visual-profile.yaml tendencies.risk 35（守り寄り）
      - visual-profile.yaml traits「忍耐」

  # 5. 模様
  markings:
    value: |
      体側に階段状の横縞を5本。上から下へ降りるにつれ、縞の間隔が広がる。
      本数は階段の段数（agent.yaml strategy.ladder.max_steps = 5）と一致させる。
    basis:
      - agent.yaml strategy.ladder（5段）
      - agent.yaml のラダーは段が下がるほど間隔が広がる（0.5 / 0.5 / 0.7 / 1.0 / 1.5%）

  # 6. 固定すべき識別要素
  #    これが崩れたら別のキャラクターになる、という線。
  identity_anchors:
    - value: 体側の階段縞5本（間隔は下ほど広い）
      basis: 戦略の核。段数は agent.yaml が正
    - value: うつむいた視線
      basis: 逆張りの姿勢そのもの
    - value: 後肢の大きな爪1対
      basis: 命名 -onychus

  evolution:
    # 7. 進化時に維持する要素
    keep:
      - 階段縞の本数（agent.yaml strategy.ladder.max_steps と一致させる）
      - うつむいた視線
      - 後肢の爪
      - 二足と長い尾
    # 8. 進化時に変更できる要素
    may_change:
      - 体格の成熟度（v1 は未成熟。以降は成長してよい）
      - 羽毛の量と質
      - 色の彩度（沈んだ調子は保つ）
      - 装飾の有無

  # 9. normal / down / up の表情・ポーズ方針
  #
  # どれを表示するかは mood-rules.yaml が実績から決めます。本ファイルは
  # 造形の方針だけを持ち、判定条件は複製しません。
  #
  # 注意：down は「成績が下向き」であって「気分が沈んでいる」ではありません。
  # ナンピノニクスにとって含み損は失敗ではなく、階段の途中です
  # （personality.md 行動原則3）。悲しませないこと。
  expressions:
    normal:
      value: |
        淡々。半眼。姿勢は前傾のまま動かない。何も起きていない日の顔。
      basis: personality.md「なにも起きない日」が好きなもの側にある

    down:
      value: |
        沈ませない。目に力を入れ、階段縞の下段側へ重心を移す。
        耐えている顔ではなく、降りている最中の顔。
      basis:
        - personality.md 行動原則3「含み損は失敗ではない。階段の途中にいるだけ」
        - personality.md 好きなもの「下落、含み損、平均取得単価が下がる瞬間」

    up:
      value: |
        少しだけ表情をゆるめる。派手に喜ばせない。爪の暖色をわずかに強める。
      basis: personality.md「利確時のセリフだけは、少しだけ嬉しそうにしてかまいません」

# 画像生成用の指示文。上の design から組み立てます。
#
# 3枚は同一個体の表情差分であり、別個体に見えてはいけません。
# normal を先に作って採用し、それを参照して down と up を作ります
# （docs/IMPLEMENTATION_PLAN.md「キャラクター画像生成の方針」）。
image_prompt:
  # 3枚すべてに共通して伝えること。
  common: |
    小型の羽毛のある獣脚類の幼体を1体だけ描いてください。

    体つき:
    - 二足歩行。やや前傾。長い尾で釣り合いを取っている
    - 頭部が体に対して大きく、四肢は細い。未成熟で、少し不格好
    - 筋肉質ではなく、丸みがある。完成された強者には見えない

    必ず入れる特徴（この3つが個体の identity です）:
    - 視線がうつむき加減で、足元より下を向いている。上を見上げさせない
    - 体側に階段状の横縞が5本。上から下へ行くほど縞の間隔が広い
    - 後肢に大きな爪が1対

    色:
    - 低彩度の青灰から灰緑を基調にする。彩度の高い色を使わない
    - 差し色は爪と目だけ。ここにだけ暖色を置き、他は沈ませる

    構図:
    - 全身が入る。背景は無地
    - 正面やや斜めから。同じ画角で3枚を描き分けられること

    避けること:
    - 攻撃的、強そう、かっこいい方向に寄せない
    - 装飾品、武器、文字、ロゴを入れない
    - 誇張したデフォルメやマスコット化をしない

  # 1枚目。これを採用してから、残り2枚の参照にします。
  normal: |
    淡々とした表情。半眼。姿勢は前傾のまま動かさない。
    何も起きていない日の顔です。

  # 2枚目以降は、採用した normal 画像を参照として渡してください。
  down: |
    成績が下向きのときの姿です。**悲しませないでください。**
    このエージェントにとって含み損は失敗ではなく、階段の途中です。
    目に力を入れ、重心を階段縞の下段側へ移す。
    耐えている顔ではなく、降りている最中の顔にしてください。

  up: |
    表情をわずかにゆるめる。派手に喜ばせない。
    爪の暖色を少しだけ強める程度にとどめてください。

# 未確定
#
# - 羽毛を全身に生やすか、部分的にとどめるか（v1 の未成熟さとどちらが合うか）
# - 階段縞を体側だけにするか、尾にも続けるか
# - 背景を透過にするか無地にするか（HTML ステータス画面の背景と合わせて決める）
