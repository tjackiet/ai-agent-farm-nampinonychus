# ナンピノニクス エージェント定義
#
# このファイルが数値パラメータの唯一の正 (single source of truth) です。
# 各 .md は「なぜその値なのか」を説明する文書であり、
# 値が食い違う場合は常に本ファイルを優先します。

# 本ファイルの形式の版。エージェント本体のバージョンではありません。
# schema_version はすべての YAML が持ちます。
schema_version: 1

# エージェント本体のバージョン。major.minor の2桁で管理します。
# **本項目だけがバージョン情報の唯一の正です**（規則は README.md「バージョンと進化」）。
# version を持つ YAML は本ファイルだけです。他ファイルは schema_version のみを持ちます。
#
# - major: 根本的な性質が変化したとき。
#     戦略の基本構造の変更 / 記憶方式の大きな変更 /
#     判断フロー・利用ツールの刷新 / 主要な能力・技の追加 /
#     キャラクターを次の形態へ進化させるとき。
#     major はそのままキャラクターの進化段階であり、
#     表示側は本項目から major を読み取って形態と画像パスを決めます。
# - minor: 同じ形態を保った改善のとき。
#     プロンプトの調整 / 売買条件・リスク値の調整 /
#     記憶件数などの調整 / 既存機能の改善 / 不具合の修正。
#
# README やコメントの修正など、判断へ影響しない変更では更新しません。
# バージョンは強さや運用成績を表しません。
# 文字列で持ちます（1.10 と 1.1 を別のバージョンとして区別するため）。
version: "1.0"

agent:
  id: nampinonychus
  name: ナンピノニクス
  name_en: Nampinonychus
  tagline: 下落を待ち、下落を買う
  archetype: contrarian-dca # 逆張り・ナンピン型
  phase: design # design | paper | halted
  documents:
    personality: personality.md
    strategy: strategy.md
    risk_policy: risk-policy.md
    memory_policy: memory-policy.md
  # スキーマの見本。実行では書き換えない（人間と Artifact が形を確認するためのもの）。
  status_file: status.yaml
  # 実行のたびに書き出すスナップショット。運用の産物であり Git 管理外。
  status_output: var/status.yaml
  # 表示用の静的プロフィール（性格・傾向・特性・技）。参照のみ。
  # 数値パラメータの正は本ファイルであり、visual-profile.yaml は表示のための要約です。
  visual_profile_file: visual-profile.yaml

runtime:
  schedule: "*/15 * * * *" # 15分ごと
  timezone: Asia/Tokyo
  max_runtime_sec: 120 # 1回の判断にかける上限
  on_error: hold # 例外・不明時は必ず HOLD（発注しない）
  dry_run: true # 設計段階では発注コマンドを組み立てるのみ

market:
  exchange: bitbank
  quote_currency: jpy
  pairs:
    - btc_jpy # 第1段階は btc_jpy のみ

cli:
  command: bitbank
  package: bitbank-lab-cli
  repo: https://github.com/bitbankinc/bitbank-lab-cli
  install: "npm i -g bitbank-lab-cli"
  global_flags: ["--format=json", "--machine"]
  mode: paper # ペーパートレードのみ

  # 実行してはならないコマンド（実資金・実績破壊）
  forbidden:
    - "bitbank trade create-order"
    - "bitbank trade cancel-order"
    - "bitbank paper reset"

  observe:
    exchange_status: "bitbank status"
    circuit_break: "bitbank circuit-break {pair}"
    ticker: "bitbank ticker {pair}"
    candles_daily: "bitbank candles {pair} --type=1day"
    candles_hourly: "bitbank candles {pair} --type=1hour"
    # アンカーの算出に使う。日中足は UTC 日ごとに区切られるため、
    # 境界をまたいでも lookback を満たせるよう --from / --to で前日から取る。
    candles_15min: "bitbank candles {pair} --type=15min"
    depth: "bitbank depth {pair}"
    # 数量の刻み・最小注文量・maker 手数料率。発注前の丸めと数量計算に使う。
    pairs: "bitbank pairs"

  account:
    assets: "bitbank paper assets"
    pnl: "bitbank paper pnl --pair={pair}"
    active_orders: "bitbank paper active-orders"
    trade_history: "bitbank paper trade-history"

  act:
    # --pair を付けない。pair 限定の部分 tick は lastTickAt を進めないため、
    # 遡り区間が伸び続けて 24 時間の上限に当たる。
    resolve_fills: "bitbank paper tick"
    create_order: "bitbank paper create-order --pair={pair} --side={side} --type={type} --price={price} --amount={amount}"
    # 取消は id のみを取る。--pair と --order-id は CLI に存在しない。
    cancel_order: "bitbank paper cancel-order --id={order_id}"

  setup:
    init_account: "bitbank paper init --jpy=1000000"

  # ペーパートレード口座の状態ファイル。環境変数 BITBANK_PAPER_STATE_PATH として
  # CLI へ渡す。リポジトリからの相対パスで、Git 管理外（.gitignore の var/）。
  # 既定の ~/.bitbank/paper-state.json とは分け、手元の実験と運用を混ぜない。
  state_path: var/paper-state.json

capital:
  initial_jpy: 1000000

strategy:
  # 基準価格（アンカー）＝直近2時間の15分足高値。
  # 実測（2026-07-19〜08-18 の15分足）で、アンカー -0.5% への到達が
  # 1日あたり約 9.8 回、うち約 73% が24時間以内に +0.3% を回復した。
  anchor:
    source: candles_15min # cli.observe のキー
    candle_type: 15min # candles --type に渡す値
    lookback_minutes: 120
    metric: high

  entry:
    order_type: limit # 指値主体（paper tick が 1分足で約定判定）
    max_pending_buy_orders: 2 # 未約定の買い指値は同時に2本まで
    cooldown_hours_after_fill: 0.5 # 約定後、次の段を出すまでの待機
    max_fills_per_day: 16 # 実測 9.8 回/日に対する余裕をみた上限

  # 買い下がりの階段。from は下落率の基準点。
  ladder:
    max_steps: 5
    total_budget_jpy: 600000
    steps:
      - { step: 1, from: anchor, drop_pct: 0.5, budget_jpy: 80000 }
      - { step: 2, from: last_fill, drop_pct: 0.5, budget_jpy: 100000 }
      - { step: 3, from: last_fill, drop_pct: 0.7, budget_jpy: 120000 }
      - { step: 4, from: last_fill, drop_pct: 1.0, budget_jpy: 140000 }
      - { step: 5, from: last_fill, drop_pct: 1.5, budget_jpy: 160000 }

  exit:
    order_type: limit
    # 平均取得単価からの上昇率。指値の maker 手数料は 0% のため、
    # 入りも出も指値なら往復コストは 0（成行の手仕舞いのみ taker 0.1%）。
    take_profit:
      - { level: 1, gain_pct: 0.3, sell_ratio: 0.5 }
      - { level: 2, gain_pct: 0.6, sell_ratio: 1.0 }
    time_stop_days: 3 # 建玉の保有上限。超過で全量手仕舞い。

  no_chase:
    enabled: true
    rule: "現在価格がアンカー以上の間は新規買いを行わない"

risk:
  max_position_ratio: 0.60 # 取得原価合計 / 初期資金
  min_cash_reserve_ratio: 0.20 # 常に残す現金比率
  per_order_max_jpy: 160000

  drawdown: # 総資産の初期比
    halt_new_buys_pct: -15.0 # 冬眠（新規買い停止・利確注文は維持）
    forced_exit_pct: -25.0 # 全建玉を成行で手仕舞い、停止

  guards:
    skip_on_circuit_break: true
    skip_on_exchange_maintenance: true
    max_data_age_sec: 300 # 5分より古いデータでは判断しない
    require_price_source: true # 価格は必ず CLI 応答由来

  # NOT_INITIALIZED は未稼働（ペーパートレード口座が未初期化）を表す初期状態。
  # status.yaml の初期値と対応する。戦略上の状態遷移は IDLE から始まる。
  states: [NOT_INITIALIZED, IDLE, LADDERING, HOLDING, HIBERNATING, HALTED]

memory:
  # 運用の記録は var/ 配下に置く。実行のたびに作業ツリーが汚れると、
  # 15分ごとの運用で git の操作が止まるため（Git 管理外）。
  root: var/memory/
  decisions:
    path: "var/memory/decisions/{date}.jsonl"
    retention_days: 90
    read_last_n: 16 # 直近4時間分を毎回読む
  daily:
    path: "var/memory/daily/{date}.md"
    write_at: "23:50"
    read_last_n: 7
  lessons:
    path: var/memory/lessons.md
    max_entries: 50
    write_trigger: position_closed
  redact: # 記憶に書き込んではならない値
    - api_key
    - api_secret
    - profile_name
