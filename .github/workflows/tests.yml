# テスト。判断ロジックとガードが壊れていないことを、PR ごとに確かめる。
#
# テストは外に出ない。`bitbank` も `claude` も呼ばず、CLI 応答は差し替えたもの
# だけを使う（tests/helpers.py）。したがって資格情報も実取引も CI には要らない。
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 下限は README の「Python 3.9 以上」。運用は 3.11。
        # 新しい版も回して、動かなくなったことに早く気づく。
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 依存を入れる
        run: python -m pip install --upgrade pip -r requirements.txt
      - name: テスト
        run: python -m unittest discover -s tests -t .
